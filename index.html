<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Joutes Sportives · PAM</title>
<meta name="description" content="Palmarès, historique et saisie en direct des joutes sportives de la PAM, since 2012.">
<meta name="theme-color" content="#161616">
<link rel="icon" href="pam.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,500;0,600;0,700;0,800;1,800&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Charte PAM : photo noir et blanc, seul le jaune des t-shirts ressort. Gris neutres, noir pour les bandeaux, jaune PAM en accent. */
:root {
  --bg: #F1F1EF;
  --surface: #FFFFFF;
  --surface-2: #E7E7E4;
  --ink: #161616;
  --muted: #5F5F5C;
  --line: #D6D6D2;
  --accent: #F5C400;
  --accent-ink: #161616;
  --accent-text: #8A6D00;
  --gold: #F5C400;
  --gold-soft: #FFF3C2;
  --good: #2F7D4F;
  --warn: #8A5A00;
  --loss: #B42318;
  --loss-soft: #FBE1DD;
  --board: #161616;
  --board-ink: #F1F1EF;
  --chip-ink: #1B1F2A;
  --font-display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --font-body: "Barlow", "Segoe UI", system-ui, sans-serif;
  --radius: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111111; --surface: #1B1B1B; --surface-2: #262626; --ink: #EDEDEA; --muted: #A3A39F;
    --line: #333331; --accent: #FFD21F; --accent-ink: #111111; --accent-text: #FFD21F; --gold: #FFD21F; --gold-soft: #3A3210;
    --good: #5BC28A; --warn: #F0B44B; --board: #000000; --board-ink: #EDEDEA; --loss: #FF7B6E; --loss-soft: #3E1E1B; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111111; --surface: #1B1B1B; --surface-2: #262626; --ink: #EDEDEA; --muted: #A3A39F;
  --line: #333331; --accent: #FFD21F; --accent-ink: #111111; --accent-text: #FFD21F; --gold: #FFD21F; --gold-soft: #3A3210;
  --good: #5BC28A; --warn: #F0B44B; --board: #000000; --board-ink: #EDEDEA; --loss: #FF7B6E; --loss-soft: #3E1E1B; color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; }
img { max-width: 100%; }
[hidden] { display: none !important; }
.authbox { display: flex; gap: 8px; align-items: center; margin-left: auto; font-size: .85rem; }
.authbox .who { opacity: .8; max-width: 180px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.authbox button { background: transparent; color: var(--board-ink); border: 1px solid currentColor; border-radius: 6px; padding: 4px 10px; cursor: pointer; font: inherit; font-weight: 600; opacity: .85; }
.authbox button.go { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); opacity: 1; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.5; }
.wrap { max-width: 1100px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; margin: 0; letter-spacing: .01em; }
h2 { font-size: 1.9rem; font-weight: 800; font-style: italic; text-transform: uppercase; }
h2::before { content: ""; display: inline-block; width: 10px; height: .8em; background: var(--accent); margin-right: 10px; transform: skewX(-12deg); vertical-align: -.02em; }
h3 { font-size: 1.3rem; font-weight: 700; }
.num { font-variant-numeric: tabular-nums; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; box-shadow: 0 0 0 6px var(--accent); }

/* En-tête */
.board { background: var(--board); color: var(--board-ink); margin-top: calc(-1 * env(safe-area-inset-top, 0px)); padding-top: env(safe-area-inset-top, 0px); border-bottom: 6px solid var(--accent); }
.board .wrap { padding-block: 18px 0; }
.brand { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.brand .pam { font-family: var(--font-display); font-style: italic; font-weight: 800; font-size: clamp(2.6rem, 8vw, 3.8rem); line-height: .9; letter-spacing: .02em; background: var(--accent); color: var(--accent-ink); padding: 4px 16px 6px 12px; border-radius: 4px; transform: skewX(-6deg); }
.brand h1 { font-size: clamp(1.6rem, 5vw, 2.4rem); font-weight: 800; text-transform: uppercase; line-height: 1; }
.brand .since { font-family: var(--font-display); font-size: 1rem; letter-spacing: .12em; text-transform: uppercase; opacity: .7; display: block; margin-top: 4px; }
nav.tabs { display: flex; gap: 4px; margin-top: 14px; overflow-x: auto; scrollbar-width: none; }
nav.tabs a { font-family: var(--font-display); font-weight: 600; font-size: 1.05rem; letter-spacing: .06em; text-transform: uppercase; color: var(--board-ink); opacity: .72; text-decoration: none; padding: 10px 14px 12px; border-bottom: 4px solid transparent; white-space: nowrap; }
nav.tabs a:hover { opacity: 1; }
nav.tabs a[aria-current="page"] { opacity: 1; border-bottom-color: var(--accent); }
.status { font-size: .85rem; color: var(--muted); padding-block: 8px 0; min-height: 1.6em; }
.status.warn { color: var(--warn); }

main { padding-block: 18px 60px; display: grid; gap: 22px; }
section.view { display: grid; gap: 20px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; min-width: 0; }
.muted { color: var(--muted); }
.small { font-size: .85rem; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.grid2 { display: grid; gap: 20px; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }
.label { font-family: var(--font-display); font-size: .85rem; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); font-weight: 600; }

/* Puces joueurs */
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 2px 10px 2px 8px; border-radius: 999px; background: var(--c, #ccc); color: var(--chip-ink); font-weight: 600; font-size: .9rem; white-space: nowrap; }
.dot { width: 10px; height: 10px; border-radius: 50%; background: var(--s, #888); flex: none; }

/* Photo d'équipe */
.team-photo { position: relative; margin: 0; border-radius: var(--radius); overflow: hidden; background: var(--board); }
.team-photo img { display: block; width: 100%; max-width: 100%; height: clamp(200px, 38vw, 340px); object-fit: cover; object-position: center 58%; }
.team-photo figcaption { position: absolute; left: 0; bottom: 14px; background: var(--accent); color: var(--accent-ink); font-family: var(--font-display); font-style: italic; font-weight: 800; font-size: clamp(1.1rem, 3vw, 1.5rem); text-transform: uppercase; letter-spacing: .04em; padding: 4px 16px 4px 14px; }

/* Champion */
.hero { display: grid; gap: 16px; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); align-items: stretch; }
@media (max-width: 760px) { .hero { grid-template-columns: 1fr; } }
.champ { background: var(--board); color: var(--board-ink); border-radius: var(--radius); padding: 22px; display: grid; gap: 6px; align-content: start; position: relative; overflow: hidden; }
.champ .yr { font-family: var(--font-display); font-size: 1rem; letter-spacing: .16em; text-transform: uppercase; color: var(--gold); }
.champ .who { font-family: var(--font-display); font-size: clamp(2.6rem, 9vw, 4.2rem); font-weight: 800; font-style: italic; line-height: .95; text-transform: uppercase; }
.champ .pts { font-family: var(--font-display); font-size: 1.3rem; opacity: .85; }
.champ .podium { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 10px; font-size: .95rem; opacity: .9; }
.champ .podium b { font-family: var(--font-display); color: var(--gold); margin-right: 4px; }

/* Mur des champions */
.wall { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 8px; }
.tile { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; background: var(--surface); text-decoration: none; color: inherit; display: grid; gap: 2px; min-height: 74px; }
a.tile:hover { border-color: var(--ink); box-shadow: inset 0 -4px 0 var(--accent); }
.tile .y { font-family: var(--font-display); font-size: 1.05rem; font-weight: 700; color: var(--muted); letter-spacing: .05em; }
.tile .n { font-family: var(--font-display); font-size: 1.25rem; font-weight: 700; line-height: 1.1; }
.tile.gap { background: transparent; border-style: dashed; }
.tile.gap .n { color: var(--muted); font-weight: 500; font-size: 1rem; }

/* Tableaux */
.tbl-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; border-radius: 8px; }
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
th, td { padding: 8px 10px; text-align: center; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { font-family: var(--font-display); font-weight: 600; letter-spacing: .05em; text-transform: uppercase; font-size: .85rem; color: var(--muted); }
th.ev { white-space: normal; min-width: 76px; max-width: 110px; line-height: 1.15; vertical-align: bottom; }
td.left, th.left { text-align: left; }
td.total { font-family: var(--font-display); font-size: 1.25rem; font-weight: 700; }
td.rank { font-family: var(--font-display); font-size: 1.2rem; font-weight: 700; width: 44px; }
tr.first td.rank { color: var(--gold); }
.cell-pts { font-weight: 600; }
.cell-place { display: block; font-size: .75rem; color: var(--muted); }
.jk { display: inline-block; font-family: var(--font-display); font-size: .7rem; font-weight: 700; letter-spacing: .05em; background: var(--accent); color: var(--accent-ink); border-radius: 4px; padding: 0 4px; margin-left: 3px; vertical-align: 1px; }
td.win { box-shadow: inset 0 -3px 0 var(--gold); }
td.loss { background: var(--loss-soft); }
td.loss .cell-pts, td.loss .cell-place { color: var(--loss); }
tr.last td.rank, tr.last td.total { color: var(--loss); }
tr.last td { background: var(--loss-soft); }
.champ .yr.red { color: var(--loss); }
.champ.red { border-left: 8px solid var(--loss); }
.tile .lose { color: var(--loss); }
.team-tag { display: inline-block; font-size: .7rem; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; color: var(--muted); }

/* Boutons et champs */
.btn { border: 1px solid var(--line); background: var(--surface); padding: 8px 14px; border-radius: 8px; cursor: pointer; font-weight: 600; }
.btn:hover { border-color: var(--ink); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.06); }
.btn.small { padding: 4px 10px; font-size: .85rem; }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.btn.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
input[type=text], input[type=number], input[type=date], select, textarea { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; min-width: 0; }
input[type=number] { width: 84px; }
.field { display: grid; gap: 4px; }
.field > span { font-size: .8rem; color: var(--muted); font-weight: 600; }

/* Sélecteur d'édition */
.yearbar { display: flex; gap: 6px; flex-wrap: wrap; }
.yearbar a { font-family: var(--font-display); font-weight: 600; font-size: 1.05rem; text-decoration: none; color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 4px 12px; background: var(--surface); }
.yearbar a.empty { color: var(--muted); border-style: dashed; background: transparent; }
.yearbar a[aria-current="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }

/* Joueurs */
.players { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 340px), 1fr)); }
table.small th, table.small td { padding: 5px 8px; }
.pcard { border-top: 6px solid var(--s); }
.pcard h3 { font-size: 1.8rem; text-transform: uppercase; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-block: 12px; }
.stat { background: var(--surface-2); border-radius: 8px; padding: 8px 10px; }
.stat b { display: block; font-family: var(--font-display); font-size: 1.6rem; line-height: 1.1; }
.stat span { font-size: .75rem; color: var(--muted); }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: .9rem; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; }

/* Graphique */
.chart-wrap { overflow-x: auto; }
.chart-wrap svg { display: block; min-width: 560px; width: 100%; height: auto; }
.legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: .85rem; }
.legend span { display: inline-flex; gap: 6px; align-items: center; }

/* Jour J */
.evcard { display: grid; gap: 12px; }
.evhead { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; align-items: baseline; }
.entry { display: grid; grid-template-columns: minmax(90px, 1.2fr) 84px 92px auto 52px; gap: 8px; align-items: center; }
.entry .pts { font-family: var(--font-display); font-size: 1.3rem; font-weight: 700; text-align: right; }
.entry.head { font-size: .75rem; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .05em; }
@media (max-width: 520px) { .entry { grid-template-columns: minmax(70px, 1fr) 66px 78px auto 40px; gap: 6px; } input[type=number] { width: 66px; } .entry select { width: 78px; } }
.pairs { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 6px; }
.pair { display: flex; justify-content: space-between; align-items: center; gap: 6px; background: var(--surface-2); border-radius: 8px; padding: 6px 8px; font-size: .85rem; }
.pair input { width: 58px; }
details.setup > summary { cursor: pointer; font-family: var(--font-display); font-size: 1.2rem; font-weight: 700; text-transform: uppercase; }
.evlist { display: grid; gap: 8px; }
.evrow { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1.3fr) auto auto; gap: 8px; align-items: center; }
@media (max-width: 560px) { .evrow { grid-template-columns: 1fr 1fr; } }
.check { display: inline-flex; gap: 6px; align-items: center; font-size: .9rem; }
.notice { border-left: 4px solid var(--warn); background: var(--surface-2); padding: 10px 14px; border-radius: 6px; font-size: .9rem; }
.empty-state { text-align: center; padding: 30px 16px; color: var(--muted); }
.livebar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--board); color: var(--board-ink); border-radius: var(--radius); padding: 10px 14px; display: flex; gap: 8px 16px; flex-wrap: wrap; align-items: center; }
.livebar .label { color: var(--board-ink); opacity: .7; }
.livebar .it { font-family: var(--font-display); font-size: 1.1rem; font-weight: 600; }
.livebar .it b { color: var(--gold); margin-right: 4px; }
.rules table td, .rules table th { text-align: left; }
.rules ul { margin: 0; padding-left: 1.2em; display: grid; gap: 6px; }
@media (prefers-reduced-motion: no-preference) { .btn, .tile, nav.tabs a { transition: border-color .15s, opacity .15s, background .15s; } }
</style>
</head>

  <div class="wrap">
    <div class="brand"><span class="pam" aria-hidden="true">PAM</span><div><h1>Joutes sportives</h1><span class="since">Since 2012</span></div><div class="authbox" id="authbox"></div></div>

<script>
(() => {
"use strict";
// ---------- Barème ----------
const BASE = [25, 18, 15, 12, 10, 8, 6, 4, 2, 1];
const ABANDON = -1;
function basePts(place, k) { let s = 0; for (let i = 0; i < k; i++) s += BASE[place - 1 + i] || 0; return Math.floor(s / k); }
function placeNum(v) { if (v == null || v === "") return null; if (typeof v === "number") return v; const m = String(v).match(/^\s*(\d+)/); return m ? +m[1] : null; }
function isAB(v) { return typeof v === "string" && /^\s*(ab|abandon)/i.test(v); }
function tieLabel(n, k) { return k > 2 ? n + " ex²" : k === 2 ? n + " ex" : String(n); }

// ---------- État ----------
const S = { players: {}, editions: {}, loaded: { p: false, e: false }, canWrite: null, readOnly: false, db: null, view: "palmares", sel: null, jourSel: null, openSetup: false };
const $app = document.getElementById("app");
const $status = document.getElementById("status");

const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const pName = id => (S.players[id] && S.players[id].name) || id;
function chip(id, extra) {
  const p = S.players[id] || {};
  return `<span class="chip" style="--c:${esc(p.chip || "#ccc")}"><span class="dot" style="--s:${esc(p.stroke || "#888")}"></span>${esc(pName(id))}${extra || ""}</span>`;
}
const stroke = id => (S.players[id] && S.players[id].stroke) || "#888";

// ---------- Calculs ----------
function eventRows(ed, ev) {
  const res = (ed.results || {})[ev.id] || {};
  const jok = ed.jokers || {};
  const counts = {};
  for (const pid of ed.players || []) { const r = res[pid]; if (r && !isAB(r.place)) { const n = placeNum(r.place); if (n) counts[n] = (counts[n] || 0) + 1; } }
  const out = {};
  for (const pid of ed.players || []) {
    const r = res[pid] || {};
    const j = jok[pid] === ev.id;
    const ab = isAB(r.place);
    const n = ab ? null : placeNum(r.place);
    let pts = null;
    if (typeof r.pts === "number") pts = r.pts;
    else if (ab) pts = ABANDON;
    else if (n) pts = basePts(n, counts[n]) * (j ? 2 : 1);
    let label = "";
    if (ab) label = "AB";
    else if (typeof r.place === "string" && r.place.trim()) label = r.place.trim();
    else if (n) label = tieLabel(n, counts[n]);
    out[pid] = { pts, place: n, label, joker: j, ab, score: r.score };
  }
  // place déduite des points quand elle n'a pas été notée (anciens tableaux)
  const missing = Object.keys(out).filter(pid => out[pid].place == null && !out[pid].ab && out[pid].pts != null);
  if (missing.length) {

function normEvent(name) {

function careerStats() {

function eventPalmares() {

      e.name = eventDisplay(key, ev.name); e.team = e.team || !!ev.team;
      e.years.push({ year: ed.year, losers: pids.filter(p => rows[p].last), winners: pids.filter(p => rows[p].place === 1) });
      for (const pid of pids) {
        const b = e.byPlayer[pid] || (e.byPlayer[pid] = { pid, n: 0, w: 0, l: 0, placeSum: 0, placed: 0 });
        b.n++; if (rows[pid].place === 1) b.w++; if (rows[pid].last) b.l++;

function jokerAdvice(ed) {
  const evs = ed.events || [];
  if (!evs.length) return "";
  const st = careerStats();
  const players = (ed.players || []).slice().sort((a, b) => (S.players[a]?.order || 99) - (S.players[b]?.order || 99));
  const lines = players.map(pid => {
    const s = st[pid];
    const cands = evs.map(ev => { const b = s && s.byEvent[normEvent(ev.name)]; return b ? { ev, b, avg: avgBase(b) } : null; }).filter(Boolean).sort((a, b) => b.avg - a.avg || a.b.losses - b.b.losses);
    const best = cands[0];
    const posed = (ed.jokers || {})[pid];
    const posedEv = posed && evs.find(e => e.id === posed);
    const txt = best ? `<b>${esc(best.ev.name)}</b> <span class="muted">(${fmt1(best.avg)} pts en moyenne sur ${best.b.n} fois${best.b.losses ? `, ${best.b.losses} défaite${best.b.losses > 1 ? "s" : ""}` : ""})</span>` : `<span class="muted">aucune épreuve du programme déjà jouée</span>`;
    return `<div class="row" style="gap:8px">${chip(pid)} ${txt}${posedEv ? ` <span class="small">· joker posé : ${esc(posedEv.name)}</span>` : ""}</div>`;
  }).join("");
  return `<div class="card" style="display:grid;gap:8px"><h3>Conseils joker</h3><p class="small muted" style="margin:0">Pour chaque joueur, l'épreuve du programme où il marque le plus en moyenne d'après l'historique.</p>${lines}</div>`;
}

// ---------- Écritures ----------
const queues = {};
function save(year, patch) {
  if (!S.db) { setStatus("Enregistrement impossible : la base de données n'est pas disponible.", true); return Promise.resolve(); }
  const key = String(year);
  const ref = S.db.doc("editions/" + key);
  queues[key] = (queues[key] || Promise.resolve()).then(() => ref.set(patch, { merge: true })).then(() => setStatus("Enregistré.")).catch(err => onWriteError(err));
  return queues[key];
}
function onWriteError(err) {
  const code = err && err.code;
  if (code === "permission-denied") { setStatus("Firebase refuse l'enregistrement : les règles de sécurité ne sont pas à jour. Copie le contenu de firestore.rules dans Firebase > Firestore > Règles, puis Publier (README, étape 3).", true); return; }
  if (code === "resource-exhausted") { setStatus("Le quota gratuit de la base de données est atteint pour aujourd'hui.", true); return; }
  setStatus("L'enregistrement a échoué. Vérifiez la connexion puis recommencez.", true);
}
function nested(obj, path, value) { let o = obj; for (let i = 0; i < path.length - 1; i++) o = o[path[i]] = o[path[i]] || {}; o[path[path.length - 1]] = value; return obj; }

function rankFromScores(ed, ev, dir) {
  const scores = ev.team ? teamScores(ed, ev) : Object.fromEntries((ed.players || []).map(pid => [pid, ((ed.results || {})[ev.id] || {})[pid]?.score]));
  const valid = Object.keys(scores).filter(pid => typeof scores[pid] === "number");
  if (!valid.length) { setStatus("Saisissez d'abord les scores de l'épreuve.", true); return; }
  const better = (a, b) => dir === "asc" ? a < b : a > b;
  const patch = { results: { [ev.id]: {} } };
  for (const pid of valid) patch.results[ev.id][pid] = { place: 1 + valid.filter(o => better(scores[o], scores[pid])).length };
  save(ed.year, unfreeze(ed, ev.id, patch));
}
// Les anciens résultats ont des points figés (repris des Excel). Dès qu'on modifie une épreuve,
// les points des joueurs qui ont une place sont recalculés à partir des places (ex aequo et joker compris).
function unfreeze(ed, evId, patch) {
  const res = (ed.results || {})[evId] || {};
  patch.results = patch.results || {}; patch.results[evId] = patch.results[evId] || {};
  for (const pid of ed.players || []) {
    const r = res[pid] || {}; const p = patch.results[evId][pid] || {};
    const hasPlace = ("place" in p) ? p.place !== "" : (r.place != null && r.place !== "");
    if (typeof r.pts === "number" && hasPlace) patch.results[evId][pid] = Object.assign(p, { pts: null });
    else if ("place" in p && typeof r.pts === "number") patch.results[evId][pid] = Object.assign(p, { pts: null });
  }
  return patch;
}

function slug(s) { return String(s).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^a-z0-9]+/g, "").slice(0, 24); }
const PALETTE = [["#D7C4F2", "#6E4BB8"], ["#BDE6E1", "#1F8A7E"], ["#F7C6DD", "#B83C7A"], ["#DAD7C8", "#7A6F3D"], ["#C9D9F7", "#2D5FB8"], ["#F2D5B3", "#A65E14"]];

$app.addEventListener("click", async e => {

    // points figés sans place (anciens tableaux) : on double ou on divise directement
    const adjust = (evId, factor) => {
      const r = ((ed.results || {})[evId] || {})[pid];
      if (!r || typeof r.pts !== "number") return;
      patch.results[evId] = patch.results[evId] || {};
      patch.results[evId][pid] = (r.place != null && r.place !== "") ? { pts: null } : { pts: Math.round(r.pts * factor) };
    };
    if (cur && cur !== ev) adjust(cur, 0.5);
    adjust(ev, cur === ev ? 0.5 : 2);
    save(ed.year, patch);
  } else if (act === "rank") rankFromScores(ed, (ed.events || []).find(x => x.id === b.dataset.ev), b.dataset.dir);
  else if (act === "clear") {
    const patch = { results: { [b.dataset.ev]: {} } }; for (const pid of ed.players || []) patch.results[b.dataset.ev][pid] = { place: "", pts: null };
    save(ed.year, patch);
  } else if (act === "status") save(ed.year, { status: b.dataset.v });
  else if (act === "save-setup") { S.openSetup = false; await save(ed.year, readSetup(ed)); }
  else if (act === "add-event") {
    const setup = readSetup(ed); const id = "e" + Date.now().toString(36);
    setup.events.push({ id, name: "Nouvelle épreuve", moment: "", team: false }); S.openSetup = true;
    await save(ed.year, setup);
    setTimeout(() => { const el = document.getElementById("s-evname-" + id); if (el) { el.focus(); el.select(); } }, 50);
  } else if (act === "ev-del" || act === "ev-up" || act === "ev-down") {
    const setup = readSetup(ed); const id = b.closest(".evrow").dataset.id; const i = setup.events.findIndex(x => x.id === id);
    if (act === "ev-del") setup.events.splice(i, 1);
    else { const j = act === "ev-up" ? i - 1 : i + 1; if (j < 0 || j >= setup.events.length) return; [setup.events[i], setup.events[j]] = [setup.events[j], setup.events[i]]; }
    S.openSetup = true; save(ed.year, setup);
  } else if (act === "add-player") {
    const name = document.getElementById("s-newplayer").value.trim(); if (!name || !S.db) return;
    let id = slug(name) || "j" + Date.now().toString(36); if (S.players[id]) id += Date.now().toString(36).slice(-3);
    const n = Object.keys(S.players).length; const [chipC, strokeC] = PALETTE[n % PALETTE.length];
    try {
      await S.db.doc("joueurs/" + id).set({ name, order: n + 1, chip: chipC, stroke: strokeC });
      const setup = readSetup(ed); setup.players.push(id); S.openSetup = true; save(ed.year, setup);
    } catch (err) { onWriteError(err); }
  }
});
$app.addEventListener("input", e => { if (e.target.matches("input[type=number], input[type=text], textarea")) e.target.dataset.dirty = "1"; });
$app.addEventListener("change", e => {
  const t = e.target; const ed = currentJourEdition();
  if (t.id === "jour-pick") { S.jourSel = t.value ? +t.value : null; render(); return; }
  if (!ed) return;
  const act = t.dataset.act;
  if (act === "score") {
    const v = t.value.trim() === "" ? null : Number(t.value.replace(",", "."));
    delete t.dataset.dirty;
    save(ed.year, nested({}, ["results", t.dataset.ev, t.dataset.p, "score"], v));
  } else if (act === "place") {
    const v = t.value === "AB" ? "AB" : t.value === "" ? "" : +t.value;
    save(ed.year, unfreeze(ed, t.dataset.ev, nested({}, ["results", t.dataset.ev, t.dataset.p, "place"], v)));
  } else if (act === "pair") {
    const v = t.value.trim() === "" ? null : Number(t.value.replace(",", "."));
    delete t.dataset.dirty;
    save(ed.year, nested({}, ["pairs", t.dataset.ev, t.dataset.k], v));
  }
});
document.addEventListener("toggle", e => { if (e.target.id === "setup") S.openSetup = e.target.open; }, true);

// ---------- Navigation ----------
function route() {
  const h = (location.hash || "").slice(1);
  const m = h.match(/^edition-(\d{4})$/);
  if (m) { S.view = "edition"; S.sel = +m[1]; }
  else S.view = ["palmares", "editions", "epreuves", "joueurs", "jour-j", "reglement"].includes(h) ? h : "palmares";
  render();
  window.scrollTo(0, 0);
}
window.addEventListener("hashchange", route);

// ---------- Données ----------
let rerenderTimer = null;
function scheduleRender() { clearTimeout(rerenderTimer); rerenderTimer = setTimeout(render, 30); }
// ---------- Bouton « Nouvel évènement » ----------
// Toujours visible dans l'en-tête et dans l'onglet Jour J. Pas de compte ni de code :
// tout le monde peut créer un évènement et saisir les résultats.
const $auth = document.getElementById("authbox");
function renderAuth() { $auth.innerHTML = `<button class="go" data-act="new-event">+ Nouvel évènement</button>`; }
renderAuth();
const NO_DB_MSG = "Impossible d'enregistrer : la base de données n'est pas branchée. Le fichier firebase-config.js contient encore « A_REMPLACER » ou n'a pas été envoyé sur GitHub (voir README, étape 2).";
async function newEvent() {
  if (!S.db) { location.hash = "#jour-j"; setStatus(NO_DB_MSG, true); return; }
  let y = new Date().getFullYear();
  while (S.editions[y]) y++;
  location.hash = "#jour-j";
  await createEdition(y);
}
document.addEventListener("click", e => {
  const b = e.target.closest("[data-act=new-event]"); if (!b) return;
  e.preventDefault();
  newEvent();
});

// Historique intégré à la page (2012-2025) : toujours affiché, même sans Firebase.
// Les données Firebase (nouvelles éditions, corrections) viennent se superposer par-dessus.
const HIST = (() => { try { return JSON.parse(document.getElementById("historique").textContent); } catch (_) { return { joueurs: {}, editions: {} }; } })();
const clone = v => JSON.parse(JSON.stringify(v));
const isObj = v => v && typeof v === "object" && !Array.isArray(v);
function deepMerge(a, b) { for (const k in b) { if (isObj(b[k]) && isObj(a[k])) deepMerge(a[k], b[k]); else a[k] = clone(b[k]); } return a; }
let fsPlayers = {}, fsEditions = {};
function combine() {
  const p = clone(HIST.joueurs || {});
  for (const id in fsPlayers) p[id] = deepMerge(p[id] || {}, fsPlayers[id]);
  const e = {};
  for (const id in HIST.editions || {}) e[id] = clone(HIST.editions[id]);
  for (const id in fsEditions) e[id] = deepMerge(e[id] || {}, fsEditions[id]);
  for (const id in e) e[id].year = +(e[id].year || id);
  S.players = p; S.editions = e; S.loaded.p = true; S.loaded.e = true;
}

async function start() {
  combine();
  route();
  const cfg = window.FIREBASE_CONFIG;
  if (!window.firebase || !cfg || !cfg.apiKey || /A_REMPLACER/.test(cfg.apiKey)) { setStatus("Historique affiché. La saisie en ligne sera active une fois firebase-config.js renseigné (voir README).", true); S.canWrite = false; render(); return; }
  setStatus("");
  firebase.initializeApp(cfg);
  const fs = firebase.firestore();
  S.db = { doc: p => fs.doc(p), collection: p => fs.collection(p) };
  render();
  const db = S.db;
  let gotEditions = false;
  const timer = setTimeout(() => { if (!gotEditions) setStatus("Les nouvelles éditions tardent à arriver : l'historique est affiché, vérifie ta connexion.", true); }, 10000);
  db.collection("joueurs").onSnapshot(snap => {
    const p = {}; snap.docs.forEach(d => { p[d.id] = d.data(); }); fsPlayers = p; combine(); scheduleRender();
  }, () => setStatus("Impossible de lire les joueurs en ligne : l'historique reste affiché.", true));
  db.collection("editions").onSnapshot(snap => {
    const e = {}; snap.docs.forEach(d => { e[d.id] = d.data(); }); fsEditions = e; combine();
    if (!snap.metadata.fromCache) { gotEditions = true; clearTimeout(timer); if (/tardent/.test($status.textContent)) setStatus(""); }
    scheduleRender();
  }, () => { clearTimeout(timer); setStatus("Impossible de lire les éditions en ligne : l'historique reste affiché. Vérifie les règles Firestore (README, étape 3).", true); });
}
start();
})();
</script>
