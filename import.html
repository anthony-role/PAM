<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Import de l'historique · PAM</title>
<meta name="robots" content="noindex">
<style>
:root { --bg: #F1F1EF; --surface: #FFFFFF; --ink: #161616; --muted: #5F5F5C; --line: #D6D6D2; --accent: #F5C400; --accent-ink: #161616; --loss: #B42318; --good: #2F7D4F; }
@media (prefers-color-scheme: dark) { :root { --bg: #111111; --surface: #1B1B1B; --ink: #EDEDEA; --muted: #A3A39F; --line: #333331; --accent: #FFD21F; --accent-ink: #111111; --loss: #FF7B6E; --good: #5BC28A; color-scheme: dark; } }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 "Segoe UI", system-ui, sans-serif; }
main { max-width: 640px; margin: 0 auto; padding: 32px 16px; display: grid; gap: 16px; }
h1 { margin: 0; font-size: 1.6rem; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 18px; display: grid; gap: 12px; }
button { font: inherit; font-weight: 600; padding: 8px 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; }
button.go { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
button[disabled] { opacity: .5; cursor: not-allowed; }
#log { font-family: Consolas, monospace; font-size: .85rem; white-space: pre-wrap; margin: 0; }
.ok { color: var(--good); } .err { color: var(--loss); } .muted { color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1>Import de l'historique PAM</h1>
  <p class="muted">À utiliser <b>une seule fois</b>, juste après la création de la base Firebase. Cette page copie le fichier <code>data/historique.json</code> (joueurs et éditions 2012-2025) dans la base.</p>
  <div class="card">
    <div id="who" class="muted">Connexion…</div>
    <div><button id="login">Se connecter avec Google</button></div>
  </div>
  <div class="card">
    <label><input type="checkbox" id="overwrite"> Remplacer les éditions déjà présentes dans la base</label>
    <div><button id="go" class="go" disabled>Importer l'historique</button></div>
    <pre id="log"></pre>
  </div>
  <p><a href="./">← Retour au site</a></p>
</main>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script>
(() => {
  const $log = document.getElementById("log"), $go = document.getElementById("go"), $who = document.getElementById("who"), $login = document.getElementById("login");
  const log = (msg, cls) => { const s = document.createElement("span"); if (cls) s.className = cls; s.textContent = msg + "\n"; $log.appendChild(s); };
  const cfg = window.FIREBASE_CONFIG;
  if (!window.firebase || !cfg || /A_REMPLACER/.test(cfg.apiKey || "")) { $who.textContent = "Firebase n'est pas configuré : renseigne d'abord firebase-config.js."; $login.disabled = true; return; }
  firebase.initializeApp(cfg);
  const auth = firebase.auth(), fs = firebase.firestore();
  auth.onAuthStateChanged(u => {
    $who.textContent = u ? "Connecté : " + (u.email || u.displayName) : "Non connecté.";
    $login.textContent = u ? "Se déconnecter" : "Se connecter avec Google";
    $go.disabled = !u;
  });
  $login.onclick = () => auth.currentUser ? auth.signOut() : auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()).catch(e => log("Connexion impossible : " + e.message, "err"));
  $go.onclick = async () => {
    $go.disabled = true; $log.textContent = "";
    try {
      const data = await fetch("data/historique.json", { cache: "no-store" }).then(r => { if (!r.ok) throw new Error("fichier data/historique.json introuvable"); return r.json(); });
      const existing = await fs.collection("editions").get();
      const overwrite = document.getElementById("overwrite").checked;
      const have = new Set(existing.docs.map(d => d.id));
      const batch = fs.batch();
      let nj = 0, ne = 0, skipped = 0;
      for (const [id, p] of Object.entries(data.joueurs || {})) { batch.set(fs.doc("joueurs/" + id), p, { merge: true }); nj++; }
      for (const [id, ed] of Object.entries(data.editions || {})) {
        if (have.has(id) && !overwrite) { skipped++; continue; }
        batch.set(fs.doc("editions/" + id), ed); ne++;
      }
      await batch.commit();
      log(`${nj} joueurs et ${ne} éditions importés.`, "ok");
      if (skipped) log(`${skipped} édition(s) déjà présente(s) laissée(s) telle(s) quelle(s).`, "muted");
      log("Terminé. Tu peux retourner sur le site.", "ok");
    } catch (e) {
      log(e && e.code === "permission-denied" ? "Refusé : ton adresse n'est pas dans config/acces (voir README, étape 3)." : "Erreur : " + (e.message || e), "err");
    } finally { $go.disabled = !auth.currentUser; }
  };
})();
</script>
</body>
</html>
