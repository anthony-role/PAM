# Site statique : aucune étape de construction, on publie le dossier tel quel.
[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/import.html"
  [headers.values]
    X-Robots-Tag = "noindex"
